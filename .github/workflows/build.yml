name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  ONDK_VERSION: "r30.1"

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/extract
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      - name: Test extractor
        working-directory: tools/extract_rs
        run: |
          cargo test --release --features http
          cargo build --release --features http

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-${{ env.ONDK_VERSION }}-linux

      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"

      - name: Link ONDK Rust toolchain
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      - name: Setup Keystore (Auto Fallback)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > keystore.jks
          else
            echo "[*] Membuat keystore otomatis untuk mode Release..."
            keytool -genkey -v -keystore keystore.jks -alias kuncisetan -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=KunciSetan, OU=Dev, O=App, L=ID, S=ID, C=ID"
          fi

      - name: Build Native binary
        run: |
          export ANDROID_NDK_HOME="${{ runner.temp }}/ondk"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          make -C src ghostlock || true
          if [ -f build/native/ghostlock ]; then
            "${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all build/native/ghostlock || true
          fi

      - name: Build Minified Release APK
        env:
          KEYSTORE_PASS_SECRET: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"

          export KEYSTORE_PATH="../keystore.jks"
          export KEYSTORE_PASS="${KEYSTORE_PASS_SECRET:-android}"
          export KEY_ALIAS="${KEY_ALIAS_SECRET:-kuncisetan}"
          export KEY_PASSWORD="${KEY_PASSWORD_SECRET:-android}"

          ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare APK Output
        run: |
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" KunciSetan-release.apk
          else
            find . -name "*release*.apk" -exec cp {} KunciSetan-release.apk \; -quit
          fi
          ls -lh KunciSetan-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: KunciSetan-APK
          path: KunciSetan-release.apk
          archive: false
